<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="local_news.css">
    <title>Postar Notícia - SFX</title>
</head>
<body>
    <div class="container">
        <h1>Nova Notícia em São Francisco Xavier</h1>
        <form id="newsForm">
            <input type="text" id="title" placeholder="Título da Notícia" required>
            <textarea id="body" placeholder="Corpo da notícia..." rows="6" required></textarea>
            <button type="submit">Publicar Notícia</button>
        </form>
    </div>

    <script src="local_news.js"></script>
</body>
</html>

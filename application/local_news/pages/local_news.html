<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>SFX Portal de Notícias</title>

  <link rel="stylesheet" href="local_news.css">
</head>


<body>

  <aside class="sidebar">
    <div class="logo">
      <span class="dot"></span>
      <h2>SFX Core</h2>
    </div>

   <nav class="menu">

            <a href="/home">
                🏠 Página Inicial
            </a>

            <a href="/publicar_noticia" class="active">
                📰 Publicar Notícia
            </a>

            <a href="/servicos">
                ⚙️ Serviços
            </a>

            <a href="/perfil">
                👤 Meu Perfil
            </a>

            <a href="/sobre">
                ℹ️ Sobre Nós
            </a>


    <div class="status-box">
      <p>servidor</p>
      <span class="online">ONLINE</span>
    </div>
  </aside>

  <main class="main-content">

    <header class="topbar">
      <div>
        <h1>Portal de Notícias Locais</h1>
        <p>Publicação de notícias locais em tempo real</p>
      </div>

      <button class="refresh-btn">
        Atualizar
      </button>
    </header>

    <section class="news-panel">

      <div class="panel-header">
        <h2>Nova Notícia</h2>
      </div>

      <form id="newsForm">

        <label for="title">Título</label>
        <input
          type="text"
          id="title"
          placeholder="Digite o título da notícia..."
          required
        >

        <label for="body">Conteúdo</label>
        <textarea
          id="body"
          rows="8"
          placeholder="Escreva o conteúdo da notícia..."
          required
        ></textarea>
        

        <button type="submit" class="publish-btn">
          Publicar notícia
        </button>

      </form>

    </section>

  </main>
  
  <script src="local_news.js"></script>

</body>
</html>
